[project]
name = "spheremm"
version = "0.1.0"
description = "Mueller-matrix rendering of spheres from their material (n, k, roughness, albedo)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "mmplot @ git+https://github.com/scandav/mm-plot@d9d679b4dfb409c6424fb9a66ea1eecd9000c100",
]

[project.scripts]
spheremm-render = "spheremm.cli:main"

[project.optional-dependencies]
mitsuba = ["mitsuba>=3.6"]

[dependency-groups]
dev = ["pytest>=8", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spheremm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
